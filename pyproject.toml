[project]
name = "vocablib"
version = "0.1.0"
description = "英単語暗記メニューバーアプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.110.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.18.0",
]
